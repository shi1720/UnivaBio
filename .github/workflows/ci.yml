name: Verify Looplight
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:model
      - run: npm run build
      - run: npm run db:local
      - name: Exercise actual local D1 and HTTP routes
        shell: bash
        run: |
          npm run dev > /tmp/looplight-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:5173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:api
      - run: npm audit --omit=dev
